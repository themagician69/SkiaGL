name: Auto-Generate and Build SkiaGL Module

on:
  workflow_dispatch: # Allows you to trigger this manually from the GitHub website anytime!
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    # --- AUTOMATIC FILE CREATION STEP ---
    - name: Generate Project Files Automatically
      run: |
        echo "Creating directory structure..."
        mkdir -p app/src/main/java/com/example/skiaglforcer
        mkdir -p app/src/main/assets

        echo "Generating AndroidManifest.xml..."
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <manifest xmlns:android="http://schemas.android.com/apk/res/android"
            package="com.example.skiaglforcer">
            <application android:label="SkiaGL Forcer">
                <meta-data android:name="xposedmodule" android:value="true" />
                <meta-data android:name="xposeddescription" android:value="Forces apps in scope to use SkiaGL instead of SkiaVK" />
                <meta-data android:name="xposedminversion" android:value="93" />
            </application>
        </manifest>
        EOF

        echo "Generating MainHook.java..."
        cat << 'EOF' > app/src/main/java/com/example/skiaglforcer/MainHook.java
        package com.example.skiaglforcer;

        import android.util.Log;
        import de.robv.android.xposed.IXposedHookLoadPackage;
        import de.robv.android.xposed.XC_MethodHook;
        import de.robv.android.xposed.XposedBridge;
        import de.robv.android.xposed.XposedHelpers;
        import de.robv.android.xposed.callbacks.XC_LoadPackage;

        public class MainHook implements IXposedHookLoadPackage {
            private static final String TAG = "SkiaGLForcer";
            @Override
            public void handleLoadPackage(XC_LoadPackage.LoadPackageParam lpparam) throws Throwable {
                if (lpparam.packageName.equals("android") || lpparam.packageName.equals("com.android.systemui")) return;
                try {
                    Class<?> systemProperties = XposedHelpers.findClass("android.os.SystemProperties", lpparam.classLoader);
                    XposedHelpers.findAndHookMethod(systemProperties, "get", String.class, new XC_MethodHook() {
                        @Override
                        protected void afterHookedMethod(MethodHookParam param) throws Throwable {
                            if ("debug.hwui.renderer".equals(param.args[0])) {
                                param.setResult("skiagl");
                                Log.d(TAG, "Forced SkiaGL for: " + lpparam.packageName);
                            }
                        }
                    });
                } catch (Exception e) {
                    XposedBridge.log(TAG + " Error: " + e.getMessage());
                }
            }
        }
        EOF

        echo "Generating xposed_init..."
        echo "com.example.skiaglforcer.MainHook" > app/src/main/assets/xposed_init

        echo "Generating app/build.gradle..."
        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
        }
        android {
            namespace 'com.example.skiaglforcer'
            compileSdk 34
            defaultConfig {
                applicationId 'com.example.skiaglforcer'
                minSdk 24
                targetSdk 34
                versionCode 1
                versionName '1.0'
            }
        }
        dependencies {
            compileOnly 'de.robv.android.xposed:api:82'
        }
        EOF

        echo "Generating root build.gradle..."
        cat << 'EOF' > build.gradle
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.1.2'
            }
        }
        allprojects {
            repositories {
                google()
                mavenCentral()
                maven { url 'https://maven.alioth.workers.dev/repository/xposed/' }
            }
        }
        EOF

        echo "Generating settings.gradle..."
        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
                maven { url 'https://maven.alioth.workers.dev/repository/xposed/' }
            }
        }
        rootProject.name = "SkiaGLForcer"
        include ':app'
        EOF

        echo "Generating gradle.properties..."
        echo "android.useAndroidX=true" > gradle.properties

        # Generate standard Gradle wrapper files if missing
        gradle wrapper
    # ---------------------------------------------

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SkiaGLForcer-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
