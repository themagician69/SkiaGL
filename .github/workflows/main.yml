name: Auto-Generate and Build Modern SkiaGL Module

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    # --- AUTOMATIC FILE CREATION STEP (MODERN API) ---
    - name: Generate Project Files Automatically
      run: |
        echo "Creating directory structure..."
        mkdir -p app/src/main/java/com/example/skiaglforcer
        mkdir -p app/src/main/assets

        echo "Generating AndroidManifest.xml..."
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <manifest xmlns:android="http://schemas.android.com/apk/res/android"
            package="com.example.skiaglforcer">
            <application android:label="SkiaGL Forcer">
                <meta-data android:name="xposedmodule" android:value="true" />
                <meta-data android:name="xposeddescription" android:value="Forces apps in scope to use SkiaGL instead of SkiaVK using modern LibXposed" />
                <meta-data android:name="xposedminversion" android:value="102" />
            </application>
        </manifest>
        EOF

        echo "Generating MainModule.java (Modern API)..."
        cat << 'EOF' > app/src/main/java/com/example/skiaglforcer/MainModule.java
        package com.example.skiaglforcer;

        import android.util.Log;
        import io.github.libxposed.api.XposedModule;
        import io.github.libxposed.api.XposedModuleInterface;
        import io.github.libxposed.api.annotations.XposedModuleInfo;

        @XposedModuleInfo(author = "SkiaGLForcer", description = "Forces SkiaGL via modern LibXposed API", version = "1.0")
        public class MainModule extends XposedModule {

            private static final String TAG = "SkiaGLForcer";

            public MainModule(XposedModuleInterface.ModuleLoadedParam param) {
                super(param);
            }

            @Override
            public void onPackageLoaded(XposedModuleInterface.PackageLoadedParam param) {
                super.onPackageLoaded(param);

                if (param.getPackageName().equals("android") || param.getPackageName().equals("com.android.systemui")) {
                    return;
                }

                try {
                    Class<?> systemProperties = getClassLoader().loadClass("android.os.SystemProperties");
                    
                    // Hook SystemProperties.get(String key)
                    hook(systemProperties.getMethod("get", String.class), new XposedModuleInterface.HookCallback() {
                        @Override
                        public void before(XposedModuleInterface.MethodHookParam param) throws Throwable {
                            // Empty if needed before execution
                        }

                        @Override
                        public void after(XposedModuleInterface.MethodHookParam param) throws Throwable {
                            String key = (String) param.getArg(0);
                            if ("debug.hwui.renderer".equals(key)) {
                                param.setResult("skiagl");
                                Log.d(TAG, "Forced SkiaGL for package: " + param.getProcessName());
                            }
                        }
                    });

                } catch (Exception e) {
                    Log.e(TAG, "Failed to hook package: " + param.getPackageName(), e);
                }
            }
        }
        EOF

        echo "Generating xposed_init..."
        echo "com.example.skiaglforcer.MainModule" > app/src/main/assets/xposed_init

        echo "Generating app/build.gradle..."
        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application' version '8.2.2'
        }

        android {
            namespace 'com.example.skiaglforcer'
            compileSdk 34

            defaultConfig {
                applicationId 'com.example.skiaglforcer'
                minSdk 24
                targetSdk 34
                versionCode 1
                versionName '1.0'
            }

            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
        }

        dependencies {
            // Modern LibXposed API dependency from Maven Central
            compileOnly 'io.github.libxposed:api:102.0.0'
        }
        EOF

        echo "Generating root build.gradle..."
        cat << 'EOF' > build.gradle
        // Root build file
        EOF

        echo "Generating settings.gradle..."
        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "SkiaGLForcer"
        include ':app'
        EOF

        echo "Generating gradle.properties..."
        echo "android.useAndroidX=true" > gradle.properties

        gradle wrapper
    # ---------------------------------------------

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SkiaGLForcer-Modern-APK
        path: app/build/outputs/apk/debug/app-debug.apk
