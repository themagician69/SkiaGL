name: Auto-Generate and Build SkiaGL Module

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    # --- AUTOMATIC FILE CREATION STEP ---
    - name: Generate Project Files Automatically
      run: |
        echo "Creating directory structure..."
        mkdir -p app/src/main/java/com/example/skiaglforcer
        mkdir -p app/src/main/assets

        echo "Generating AndroidManifest.xml..."
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <manifest xmlns:android="http://schemas.android.com/apk/res/android"
            package="com.example.skiaglforcer">
            <application android:label="SkiaGL Forcer">
                <meta-data android:name="xposedmodule" android:value="true" />
                <meta-data android:name="xposeddescription" android:value="Forces apps in scope to use SkiaGL instead of SkiaVK" />
                <meta-data android:name="xposedminversion" android:value="82" />
            </application>
        </manifest>
        EOF

        echo "Generating MainHook.java..."
        cat << 'EOF' > app/src/main/java/com/example/skiaglforcer/MainHook.java
        package com.example.skiaglforcer;

        import android.util.Log;
        import de.robv.android.xposed.IXposedHookLoadPackage;
        import de.robv.android.xposed.XC_MethodHook;
        import de.robv.android.xposed.XposedBridge;
        import de.robv.android.xposed.XposedHelpers;
        import de.robv.android.xposed.callbacks.XC_LoadPackage;

        public class MainHook implements IXposedHookLoadPackage {
            private static final String TAG = "SkiaGLForcer";

            @Override
            public void handleLoadPackage(XC_LoadPackage.LoadPackageParam lpparam) throws Throwable {
                if (lpparam.packageName.equals("android") || lpparam.packageName.equals("com.android.systemui")) {
                    return;
                }

                try {
                    Class<?> systemProperties = XposedHelpers.findClass("android.os.SystemProperties", lpparam.classLoader);
                    
                    XposedHelpers.findAndHookMethod(systemProperties, "get", String.class, new XC_MethodHook() {
                        @Override
                        protected void afterHookedMethod(MethodHookParam param) throws Throwable {
                            String key = (String) param.args[0];
                            if ("debug.hwui.renderer".equals(key)) {
                                param.setResult("skiagl");
                                Log.d(TAG, "Successfully forced SkiaGL for: " + lpparam.packageName);
                            }
                        }
                    });
                } catch (Exception e) {
                    XposedBridge.log(TAG + " Error hooking package " + lpparam.packageName + ": " + e.getMessage());
                }
            }
        }
        EOF

        echo "Generating xposed_init..."
        echo "com.example.skiaglforcer.MainHook" > app/src/main/assets/xposed_init

        echo "Generating app/build.gradle..."
        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application' version '8.2.2'
        }

        android {
            namespace 'com.example.skiaglforcer'
            compileSdk 34

            defaultConfig {
                applicationId 'com.example.skiaglforcer'
                minSdk 24
                targetSdk 34
                versionCode 1
                versionName '1.0'
            }

            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
        }

        dependencies {
            compileOnly 'de.robv.android.xposed:api:82'
        }
        EOF

        echo "Generating root build.gradle..."
        cat << 'EOF' > build.gradle
        // Root build file
        EOF

        echo "Generating settings.gradle..."
        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
                maven { url 'https://api.xposed.info/' }
            }
        }
        rootProject.name = "SkiaGLForcer"
        include ':app'
        EOF

        echo "Generating gradle.properties..."
        echo "android.useAndroidX=true" > gradle.properties

        gradle wrapper
    # ---------------------------------------------

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SkiaGLForcer-Stable-APK
        path: app/build/outputs/apk/debug/app-debug.apk
